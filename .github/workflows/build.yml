name: Build IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug streamLib
        run: |
          curl -s "https://moviking.neuronix.sbs/Content/JS/streamLib.js?e=1" \
            -H "Referer: https://moviking.neuronix.sbs/" \
            -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1" \
            | head -100
      
      - name: Package IPA
        run: |
          mkdir -p Payload/PhimHay.app
          cp App Payload/PhimHay.app/
          
          # Generate App Icon sau khi đã có Payload
          curl -L -o icon.png "https://raw.githubusercontent.com/ek08mt-pixel/movieappp/refs/heads/main/AppIcon.png"
          
          # Tạo các kích thước icon trong app bundle
          sips -z 120 120 icon.png --out Payload/PhimHay.app/AppIcon60x60@2x.png
          sips -z 180 180 icon.png --out Payload/PhimHay.app/AppIcon60x60@3x.png
          sips -z 76 76 icon.png --out Payload/PhimHay.app/AppIcon76x76.png
          sips -z 152 152 icon.png --out Payload/PhimHay.app/AppIcon76x76@2x.png
          sips -z 1024 1024 icon.png --out Payload/PhimHay.app/AppIcon1024x1024.png
          
          cat > Payload/PhimHay.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>App</string>
          <key>CFBundleIdentifier</key><string>com.emmew.app</string>
          <key>CFBundleName</key><string>EMCC</string>
          <key>CFBundleDisplayName</key><string>EMCC</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>UILaunchScreen</key><dict/>
          <key>CFBundleIconFiles</key>
          <array>
              <string>AppIcon60x60</string>
              <string>AppIcon76x76</string>
          </array>
          <key>CFBundleIcons</key>
          <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                  <key>CFBundleIconFiles</key>
                  <array>
                      <string>AppIcon60x60</string>
                  </array>
              </dict>
          </dict>
          <key>UISupportedInterfaceOrientations</key>
          <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
          </array>
          <key>MinimumOSVersion</key><string>18.0</string>
          <key>NSAppTransportSecurity</key>
          <dict>
              <key>NSAllowsArbitraryLoads</key><true/>
              <key>NSAllowsArbitraryLoadsInWebContent</key><true/>
              <key>NSAllowsArbitraryLoadsForMedia</key><true/>
              <key>NSAllowsLocalNetworking</key><true/>
          </dict>
          <key>UIBackgroundModes</key>
          <array>
              <string>audio</string>
          </array>
          <key>LSApplicationQueriesSchemes</key>
          <array>
              <string>infuse</string>
              <string>vlc-x-callback</string>
              <string>vimu</string>
              <string>outplayer</string>
              <string>nplayer</string>
              <string>pxtreme</string>
              <string>fbplayer</string>
              <string>mxplayer</string>
              <string>iina</string>
          </array>
          </dict></plist>
          EOF
          
          zip -r EMCC.ipa Payload/
          ls -la EMCC.ipa
      
      - uses: actions/upload-artifact@v4
        with:
          name: EMCC-IPA
          path: EMCC.ipa